pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    // Lets Gradle download a Java 17 toolchain by itself when only a newer JDK is installed
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// Keep this equal to the folder name of the project, or IntelliJ IDEA complains
rootProject.name = 'fluidcompat-forge-1.20.1'
