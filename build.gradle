plugins {
    id 'java-library'
    // ModDevGradle Legacy: the plugin of the user's own template.zip (MultiLoader-Template), used here for Forge only
    id 'net.neoforged.moddev.legacyforge' version '2.0.77'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 17 language level on purpose: a newer syntax would compile here and then fail on the player's Java 17
    options.release = java_version as int
}

repositories {
    mavenCentral()
    // libs/ as a repository: the "mod" configurations of ModDevGradle Legacy only take coordinates, not file collections
    flatDir {
        dirs 'libs'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForged'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
}

// The Mixin annotation processor writes the refmap that turns Mojang names into SRG names. Forge 1.20.1 runs with
// SRG names in a real game, so the one patch that targets a vanilla class (LiquidBlock) needs it.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.compat.flowingfluidspatches.mixins.json"
    config "${mod_id}.compat.mekanism.mixins.json"
    config "${mod_id}.compat.mekanism.sweep.mixins.json"
    config "${mod_id}.compat.mekanismelements.mixins.json"
    config "${mod_id}.compat.alexscaves.mixins.json"
    config "${mod_id}.compat.mekanismelements.thinwater.mixins.json"
    config "${mod_id}.compat.fluidlogged.mixins.json"
    config "${mod_id}.compat.immersiveengineering.mixins.json"
    config "${mod_id}.compat.gtceu.mixins.json"
    config "${mod_id}.compat.immersiveengineering.cobble.mixins.json"
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // The bytecode guards read class files with ASM; Forge ships it at run time, this is for compiling only
    compileOnly 'org.ow2.asm:asm-tree:9.5'

    // YACL is optional and only used by the client settings screen. Its public API uses vanilla class names only,
    // so a plain compile-only file dependency is enough (no remapping needed, unlike the "mod" configurations).
    // Put its Forge 1.20.1 jar in libs/ (file name starting with YetAnotherConfigLib or yet_another_config_lib).
    compileOnly files(fileTree(dir: 'libs', include: ['YetAnotherConfigLib*.jar', 'yet_another_config_lib*.jar']).files)

}

// Flowing Fluids is a REQUIRED dependency and is never bundled: only its public API is called.
// Put its Forge 1.20.1 jar in libs/ (see libs/README.txt). The "mod" configurations remap a released (SRG) jar to the
// names this project is compiled with; modImplementation also puts it on the IDE run configurations.
// A file named flowing_fluids-1.0.6-1.20.1-forge.jar becomes the coordinate local:flowing_fluids:1.0.6-1.20.1-forge.
def flowingFluidsJar = fileTree(dir: 'libs', include: 'flowing_fluids*.jar').files.sort().find { true }
if (flowingFluidsJar == null) {
    logger.warn('WARNING: no flowing_fluids*.jar in libs/, the project cannot compile without it')
} else {
    def jarBaseName = flowingFluidsJar.name.replaceAll(/\.jar$/, '')
    int firstDash = jarBaseName.indexOf('-')
    dependencies {
        modImplementation "local:${jarBaseName.substring(0, firstDash)}:${jarBaseName.substring(firstDash + 1)}"
    }
}

processResources {
    var expandProps = [
            'version'                   : project.version,
            'minecraft_version_range'   : minecraft_version_range,
            'forge_loader_version_range': forge_loader_version_range,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'mod_license'               : mod_license,
            'mod_description'           : mod_description
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${mod_name.replace(' ', '')}" }
    }
    manifest.attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : project.version,
            'Implementation-Title'  : mod_id,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : mod_author,
            'Built-On-Minecraft'    : minecraft_version,
            // Forge 1.20.1 only loads mixin configs that are named here
            'MixinConfigs'          : [
                    "${mod_id}.compat.flowingfluidspatches.mixins.json",
                    "${mod_id}.compat.mekanism.mixins.json",
                    "${mod_id}.compat.mekanism.sweep.mixins.json",
                    "${mod_id}.compat.mekanismelements.mixins.json",
                    "${mod_id}.compat.alexscaves.mixins.json",
                    "${mod_id}.compat.mekanismelements.thinwater.mixins.json",
                    "${mod_id}.compat.fluidlogged.mixins.json",
                    "${mod_id}.compat.immersiveengineering.mixins.json",
                    "${mod_id}.compat.gtceu.mixins.json",
                    "${mod_id}.compat.immersiveengineering.cobble.mixins.json"
            ].join(',')
    ])
}
